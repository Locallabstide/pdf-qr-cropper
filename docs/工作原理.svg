  <text x="561" y="68" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">3 · 导出 ZIP</text>
  <text x="561" y="88" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">正方形 JPG 打包</text>
</g>

