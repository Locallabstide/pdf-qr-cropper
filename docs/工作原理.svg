<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
<title>PDF 二维码提取工具工作示意</title>
<desc>上方为三步工作流程：选择 PDF、浏览器本地检测裁切、导出 ZIP。下方为界面示意，左侧参数面板，右侧为裁切结果网格。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="30" font-size="15" font-weight="500" fill="#1f2933">工作流程</text>

<g>
