  <text x="336" y="68" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">2 · 本地检测裁切</text>
  <text x="336" y="88" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">码眼定位 · 多核并行</text>
</g>
<line x1="430" y1="75" x2="474" y2="75" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
