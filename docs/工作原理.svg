  <text x="115" y="68" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">1 · 拖入 PDF</text>
  <text x="115" y="88" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">拖到窗口任意位置</text>
</g>
<line x1="196" y1="75" x2="240" y2="75" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
